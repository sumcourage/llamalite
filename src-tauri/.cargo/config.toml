# Windows 下规避 Defender 干扰 (os error 998) 专用配置
# 策略：保留 MSVC 工具链（已被验证本机能生成 exe），但降低并发并禁用增量编译
# - codegen-units=1  降低 rlib 归档竞争
# - incremental=false  减少 .tmp 目录
# - 构建脚本会再用 CARGO_BUILD_JOBS=1 进一步串行

[profile.release]
incremental = false
codegen-units = 1

[profile.dev]
incremental = false
codegen-units = 1
